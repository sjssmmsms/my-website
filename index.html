<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="screen-orientation" content="landscape">
    <meta name="orientation" content="landscape">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="环境检察员">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- 防止缓存 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>我是环境检察员 - 环保小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .container {
            width: 850px;
            height: 310px;
            display: flex;
            flex-direction: column;
            margin-top: 0;
            margin-bottom: 0;
            margin-left: auto;
            margin-right: auto;
            padding-top: 0;
            padding-bottom: 0;
            padding-left: 20px;
            padding-right: 20px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            margin-top: -30px;
            margin-bottom: -30px;
        }

        h1 {
            font-size: 3.5rem;
            color: #4ade80;
            text-shadow: 0 0 20px rgba(74, 222, 128, 0.5);
            margin-bottom: 10px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px rgba(74, 222, 128, 0.5); }
            to { text-shadow: 0 0 40px rgba(74, 222, 128, 0.8); }
        }

        .subtitle {
            font-size: 1.2rem;
            color: #a5b4fc;
            margin-bottom: 30px;
        }

        .start-section {
            text-align: center;
            padding: 40px 20px;
        }

        #startBtn {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            border: none;
            padding: 20px 60px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(34, 197, 94, 0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: -50px;
            margin-bottom: -50px;
        }

        #startBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(34, 197, 94, 0.6);
        }

        #startBtn:active {
            transform: scale(0.98);
        }

        #resetBtn {
            background: linear-gradient(135deg, #64748b 0%, #475569 100%);
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(71, 85, 105, 0.3);
            margin-top: 15px;
        }

        #resetBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(71, 85, 105, 0.6);
        }

        #resetBtn:active {
            transform: scale(0.98);
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #64748b;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) and (orientation: landscape) {
            body {
                min-height: 100vw;
            }
            
            h1 {
                font-size: 1.5rem;
                margin-bottom: 5px;
            }

            .subtitle {
                font-size: 0.8rem;
                margin-bottom: 10px;
            }

            header {
                padding: 10px 5px;
            }

            .start-section {
                padding: 15px 5px;
            }

            #startBtn {
                padding: 10px 25px;
                font-size: 0.9rem;
            }

            .container {
                width: 100vw !important;
                height: 100vh !important;
                max-height: 100vh;
                padding: 10px;
                overflow-y: auto;
            }
            
            footer {
                padding: 15px;
                font-size: 0.7rem;
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            #startBtn {
                padding: 15px 40px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌍 我是环境检察员</h1>
            <p class="subtitle">保护环境，人人有责！找出所有污染源，守护我们的地球家园</p>
        </header>

        <div class="start-section">
            <button id="startBtn" onclick="window.location.href='levels.html'">🚀 开始游戏</button>
        </div>

        <footer>
            <p>🌱 保护环境，从我做起 | 我是环境检察员小游戏</p>
        </footer>
    </div>

    <script>
        // 初始化游戏进度 - 确保只有第一关是解锁的
        (function initializeGame() {
            if (!localStorage.getItem('unlockedLevel')) {
                localStorage.setItem('unlockedLevel', '1');
                console.log('游戏初始化完成 - 第一关已解锁');
            }
        })();
    </script>

</body>
</html>
