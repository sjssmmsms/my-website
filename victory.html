<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>胜利！</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            text-align: center;
            background: rgba(0,0,0,0.5);
            padding: 40px;
            border-radius: 20px;
            max-width: 400px;
        }
        .celebration {
            font-size: 64px;
            margin-bottom: 20px;
        }
        h1 {
            color: #ffd700;
            font-size: 32px;
            margin-bottom: 30px;
        }
        .stars {
            font-size: 40px;
            margin-bottom: 20px;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            text-align: center;
        }
        .stat-item {
            flex: 1;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #4ecdc4;
        }
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
        }
        .btn-primary {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
        }
        .btn-secondary {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container" id="victoryContainer">
        <div class="celebration">🎉</div>
        <h1>恭喜你获得胜利！</h1>
        <div class="stars">⭐⭐⭐</div>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">通过波次</div>
                <div class="stat-value" id="waves">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">剩余生命</div>
                <div class="stat-value" id="lives">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">获得金币</div>
                <div class="stat-value" id="gold">0</div>
            </div>
        </div>
        
        <button class="btn btn-primary" onclick="restartGame()">🔄 再来一局</button>
        <button class="btn btn-secondary" onclick="nextLevel()" id="nextLevelBtn" style="display: none;">▶️ 下一关</button>
        <button class="btn btn-secondary" onclick="goHome()">🏠 返回主页</button>
    </div>
    
    <div class="container" id="comingSoonContainer" style="display: none;">
        <div class="celebration">🚀</div>
        <h1>敬请期待！</h1>
        <p style="margin: 20px 0; font-size: 16px; color: #aaa;">你已经通关了所有关卡！<br>更多关卡正在开发中...</p>
        <div class="stars">🌟🌟🌟🌟</div>
        <button class="btn btn-primary" onclick="restartGame()">🔄 重玩第1关</button>
        <button class="btn btn-secondary" onclick="goHome()">🏠 返回主页</button>
    </div>

    <script>
        function loadStats() {
            const result = localStorage.getItem('battleResult');
            const nextLevelBtn = document.getElementById('nextLevelBtn');
            const victoryContainer = document.getElementById('victoryContainer');
            const comingSoonContainer = document.getElementById('comingSoonContainer');
            
            if (result) {
                const data = JSON.parse(result);
                document.getElementById('waves').textContent = data.waves;
                document.getElementById('lives').textContent = data.lives;
                document.getElementById('gold').textContent = data.gold;
                
                const currentLevel = parseInt(localStorage.getItem('currentLevel')) || 1;
                const unlockedLevel = parseInt(localStorage.getItem('unlockedLevel')) || 1;
                
                if (data.waves >= 5) {
                    // 解锁下一关（如果有的话）
                    if (currentLevel + 1 > unlockedLevel && currentLevel + 1 <= 4) {
                        localStorage.setItem('unlockedLevel', (currentLevel + 1).toString());
                    }
                    
                    // 检查是否是最后一关（第4关）
                    if (currentLevel >= 4) {
                        // 显示"敬请期待"页面
                        victoryContainer.style.display = 'none';
                        comingSoonContainer.style.display = 'block';
                    } else {
                        // 显示下一关按钮
                        nextLevelBtn.style.display = 'inline-block';
                    }
                }
            }
        }

        function restartGame() {
            const currentLevel = parseInt(localStorage.getItem('currentLevel')) || 1;
            // 如果当前在第4关，重置到第1关
            if (currentLevel >= 4) {
                localStorage.setItem('currentLevel', '1');
            }
            window.location.href = 'game.html';
        }

        function nextLevel() {
            const currentLevel = parseInt(localStorage.getItem('currentLevel')) || 1;
            if (currentLevel < 4) {
                localStorage.setItem('currentLevel', (currentLevel + 1).toString());
            }
            window.location.href = 'game.html';
        }

        function goHome() {
            window.location.href = 'index.html';
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadStats);
        } else {
            loadStats();
        }
    </script>
</body>
</html>
