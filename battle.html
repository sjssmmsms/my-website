<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我是环境检察员 - 战斗场景</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #1a1a2e;
            color: white;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .status-bar {
            height: 36px;
            background: #0f3460;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
        }

        .back-btn {
            color: #fff;
            cursor: pointer;
            font-size: 12px;
        }

        .gold-panel {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #ffd700;
            font-size: 12px;
        }

        .life-panel {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .heart {
            color: #e74c3c;
            font-size: 14px;
        }

        .wave-panel {
            display: flex;
            align-items: center;
            gap: 3px;
            color: #4ecdc4;
            font-size: 12px;
        }

        .battle-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .left-spawn {
            width: 8%;
            background: #5a4a3a;
            border-right: 2px solid #e74c3c;
            position: relative;
        }

        .spawn-line {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, transparent 0%, #e74c3c 50%, transparent 100%);
        }

        .center-battle {
            flex: 1;
            background: #2d5a27;
            position: relative;
            overflow: hidden;
        }

        .monster {
            position: absolute;
            font-size: 24px;
        }

        .monster.boss {
            font-size: 48px;
            filter: drop-shadow(0 0 10px red);
            animation: bossPulse 1s infinite;
        }

        .monster.boss::after {
            content: attr(data-hp) '/' attr(data-max-hp);
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff0000;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            white-space: nowrap;
        }

        @keyframes bossPulse {
            0%, 100% { transform: scale(2); }
            50% { transform: scale(2.1); }
        }

        .tower-menu {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #ffd700;
            border-radius: 8px;
            padding: 10px;
            z-index: 1000;
            min-width: 120px;
            text-align: center;
        }

        .tower-menu button {
            display: block;
            width: 100%;
            padding: 6px 12px;
            margin: 5px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .tower-menu .upgrade-btn {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #000;
        }

        .tower-menu .remove-btn {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            color: #fff;
        }

        .tower-menu button:hover {
            opacity: 0.9;
        }

        .tower-level {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #ffd700;
            color: #000;
            font-size: 10px;
            font-weight: bold;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .right-wall {
            width: 18%;
            background: #4a5a3d;
            padding: 5px;
        }

        .wall-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            height: 100%;
        }

        .wall-cell {
            background: #5a6a4d;
            border: 1px dashed #6b7a5d;
            border-radius: 3px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
            position: relative;
        }

        .wall-cell:hover {
            background: #6a7a5d;
        }

        .wall-cell.placed {
            background: #3a4a2d;
            border-color: #27ae60;
        }

        .bottom-towers {
            position: absolute;
            bottom: 0;
            left: 8%;
            right: 18%;
            height: 50px;
            display: flex;
            gap: 6px;
            padding: 5px;
            background: rgba(0, 0, 0, 0.3);
        }

        .tower-slot {
            flex: 1;
            background: #8b6914;
            border-radius: 6px;
            border: 2px dashed #a08020;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
        }

        .tower-slot:hover {
            background: #9b7924;
        }

        .projectile {
            position: absolute;
            font-size: 12px;
            pointer-events: none;
        }

        .pause-btn {
            height: 30px;
            padding: 0 12px;
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .pause-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .pause-overlay.show {
            display: flex;
        }

        .pause-menu {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
        }

        .pause-title {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 20px;
        }

        .pause-btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .pause-menu-btn {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .pause-menu-btn.resume {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            color: white;
        }

        .pause-menu-btn.exit {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
        }

        .pause-menu-btn:hover {
            transform: scale(1.05);
        }

        .victory-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.5s ease-out;
        }

        .victory-overlay.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .victory-menu {
            background: #1a1a2e;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            animation: bounceIn 0.6s ease-out;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            60% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .victory-emoji {
            font-size: 72px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .victory-title {
            font-size: 28px;
            font-weight: bold;
            color: #ffd700;
            margin: 15px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .victory-stars {
            font-size: 36px;
            margin-bottom: 20px;
            animation: twinkle 1s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .victory-stats {
            display: flex;
            gap: 30px;
            margin-bottom: 25px;
        }

        .victory-stat {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .victory-stat .stat-label {
            font-size: 12px;
            color: #aaa;
        }

        .victory-stat .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #4ecdc4;
        }

        .victory-btn-group {
            display: flex;
            gap: 15px;
        }

        .victory-btn {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .victory-btn.restart {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            color: white;
        }

        .victory-btn.home {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
        }

        .victory-btn:hover {
            transform: scale(1.05);
        }

        .explosion {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, #ffd700 0%, #ff8c00 50%, #ff4500 100%);
            animation: explode 0.5s ease-out forwards;
            pointer-events: none;
        }

        @keyframes explode {
            0% {
                width: 10px;
                height: 10px;
                opacity: 1;
                transform: scale(0.5);
            }
            50% {
                opacity: 0.8;
            }
            100% {
                width: 56px;
                height: 56px;
                opacity: 0;
                transform: scale(1);
            }
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        @keyframes fadeOutScale {
            from {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
            to {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
        }
    </style>
</head>
<body>
    <div class="status-bar">
        <div class="back-btn">◀ 返回</div>
        <div class="gold-panel">💰 300</div>
        <div class="life-panel">
            <span class="heart">❤️</span>
            <span class="heart">❤️</span>
            <span class="heart">❤️</span>
            <span class="heart">❤️</span>
            <span class="heart">❤️</span>
            <span class="heart">❤️</span>
        </div>
        <div class="wave-panel">🌊 第1波</div>
        <button class="pause-btn" id="pauseBtn">⏸️ 暂停</button>
    </div>

    <div class="battle-container">
        <div class="left-spawn">
            <div class="spawn-line"></div>
        </div>

        <div class="center-battle">
            <div class="bottom-towers" id="towerSlots">
                <div class="tower-slot" data-slot="0"></div>
                <div class="tower-slot" data-slot="1"></div>
                <div class="tower-slot" data-slot="2"></div>
                <div class="tower-slot" data-slot="3"></div>
                <div class="tower-slot" data-slot="4"></div>
                <div class="tower-slot" data-slot="5"></div>
                <div class="tower-slot" data-slot="6"></div>
            </div>
        </div>

        <div class="right-wall">
            <div class="wall-grid" id="wallGrid">
                <div class="wall-cell" data-wall="0"></div>
                <div class="wall-cell" data-wall="1"></div>
                <div class="wall-cell" data-wall="2"></div>
                <div class="wall-cell" data-wall="3"></div>
                <div class="wall-cell" data-wall="4"></div>
                <div class="wall-cell" data-wall="5"></div>
                <div class="wall-cell" data-wall="6"></div>
                <div class="wall-cell" data-wall="7"></div>
                <div class="wall-cell" data-wall="8"></div>
                <div class="wall-cell" data-wall="9"></div>
                <div class="wall-cell" data-wall="10"></div>
                <div class="wall-cell" data-wall="11"></div>
                <div class="wall-cell" data-wall="12"></div>
                <div class="wall-cell" data-wall="13"></div>
                <div class="wall-cell" data-wall="14"></div>
            </div>
        </div>
    </div>

    <div class="pause-overlay" id="pauseOverlay">
        <div class="pause-menu">
            <div class="pause-title">⏸️ 游戏暂停</div>
            <div class="pause-btn-group">
                <button class="pause-menu-btn resume" id="resumeBtn">▶️ 继续游戏</button>
                <button class="pause-menu-btn exit" id="exitBtn">🚪 退出关卡</button>
            </div>
        </div>
    </div>

    <div class="victory-overlay" id="victoryOverlay">
        <div class="victory-menu">
            <div class="victory-emoji">🎉</div>
            <div class="victory-title">恭喜你获得胜利!</div>
            <div class="victory-stars">⭐⭐⭐</div>
            <div class="victory-stats">
                <div class="victory-stat">
                    <span class="stat-label">通过波次</span>
                    <span class="stat-value" id="victoryWaves">3</span>
                </div>
                <div class="victory-stat">
                    <span class="stat-label">剩余生命</span>
                    <span class="stat-value" id="victoryLives">6</span>
                </div>
                <div class="victory-stat">
                    <span class="stat-label">获得金币</span>
                    <span class="stat-value" id="victoryGold">300</span>
                </div>
            </div>
            <div class="victory-btn-group">
                <button class="victory-btn restart" onclick="restartGame()">🔄 再来一局</button>
                <button class="victory-btn home" onclick="goHome()">🏠 返回主页</button>
            </div>
        </div>
    </div>

    <script>
        let towers = ['', '', '', '', '', '', ''];
        let selectedSlot = null;
        let monsters = [];
        let monsterId = 0;
        let lives = 6;
        let score = 0;
        let gold = parseInt(localStorage.getItem('currentGold')) || 300;
        let projectiles = [];
        let isPaused = false;
        let spawnInterval = null;
        let activeRainbowTowers = new Set();
        let activeBombTowers = new Set();
        
        let currentWave = 1;
        const totalWaves = 5;
        let monstersToSpawn = 0;
        let monstersSpawned = 0;
        let monstersKilled = 0;
        let monstersEscaped = 0;
        let bossKilled = false;
        let waveInProgress = false;
        let waveStartDelay = null;
        
        const waveConfig = {
            1: { count: 8, interval: 1500, monsterLevel: 1 },
            2: { count: 12, interval: 1200, monsterLevel: 1 },
            3: { count: 18, interval: 1000, monsterLevel: 2 },
            4: { count: 25, interval: 800, monsterLevel: 2 },
            5: { count: 30, interval: 600, monsterLevel: 3, hasBoss: true }
        };

        const monsterLevelConfig = {
            1: { hpMultiplier: 1, rewardMultiplier: 1 },
            2: { hpMultiplier: 1.5, rewardMultiplier: 1.5 },
            3: { hpMultiplier: 2, rewardMultiplier: 2 }
        };

        const towerCosts = {
            'basic': 50,
            'water': 80,
            'light': 120,
            'rainbow': 180,
            'wind': 150,
            'solar': 200,
            'purify': 250,
            'thunder': 300
        };

        const towerUpgradeCosts = {
            'basic': { 2: 75, 3: 100 },
            'water': { 2: 120, 3: 160 },
            'light': { 2: 180, 3: 240 },
            'rainbow': { 2: 270, 3: 360 },
            'wind': { 2: 225, 3: 300 },
            'solar': { 2: 300, 3: 400 },
            'purify': { 2: 375, 3: 500 },
            'thunder': { 2: 450, 3: 600 }
        };

        let selectedTowerCell = null;
        window.towerLevels = {};

        const emojis = {
            'basic': '🌿',
            'water': '💧',
            'light': '☀️',
            'rainbow': '🌈',
            'wind': '🌀',
            'solar': '🔆',
            'purify': '🧪',
            'thunder': '⚡'
        };

        const towerInfo = {
            '🌿': { damage: 25, interval: 1200, type: 'ray', name: 'basic' },
            '💧': { damage: 28, interval: 1100, type: 'water', name: 'water' },
            '☀️': { damage: 50, interval: 1400, type: 'bomb', name: 'light' },
            '🌈': { damage: 70, interval: 1300, type: 'rainbow', name: 'rainbow' },
            '🌀': { damage: 32, interval: 900, type: 'ray', name: 'wind' },
            '🔆': { damage: 60, interval: 1300, type: 'bomb', name: 'solar' },
            '🧪': { damage: 38, interval: 1000, type: 'water', name: 'purify' },
            '⚡': { damage: 90, interval: 1600, type: 'bomb', name: 'thunder' }
        };

        const monsterInfo = {
            '🗑️': { hp: 80, speed: 'fast', reward: 10, name: '垃圾怪' },
            '💨': { hp: 120, speed: 'medium', reward: 15, name: '废气怪' },
            '💀': { hp: 200, speed: 'slow', reward: 25, name: '污染王' },
            '🦠': { hp: 300, speed: 'medium', reward: 35, name: '病毒怪' },
            '🧴': { hp: 150, speed: 'fast', reward: 20, name: '塑料怪' },
            '🔋': { hp: 180, speed: 'medium', reward: 22, name: '电池怪' },
            '🛢️': { hp: 250, speed: 'slow', reward: 30, name: '油污怪' },
            '☢️': { hp: 350, speed: 'slow', reward: 45, name: '辐射怪' },
            '👹': { hp: 3000, speed: 'very-slow', reward: 500, name: '环境破坏王', isBoss: true }
        };

        function loadTowers() {
            const savedTowers = localStorage.getItem('battleTowers');
            if (savedTowers) {
                towers = JSON.parse(savedTowers);
            }
            const towerSlots = document.querySelectorAll('.tower-slot');
            towerSlots.forEach((slot, index) => {
                slot.textContent = towers[index] || '';
                slot.classList.remove('selected');
            });
            selectedSlot = null;
            startTowerAttacks();
        }

        function spawnMonster() {
            console.log('spawnMonster:', '已生成:', monstersSpawned, '/', monstersToSpawn, '场上:', monsters.length);
            
            const config = waveConfig[currentWave];
            
            if (monstersSpawned >= monstersToSpawn) {
                if (config.hasBoss && !window.bossSpawned) {
                    window.bossSpawned = true;
                    setTimeout(() => {
                        console.log('开始生成Boss!');
                        spawnBoss();
                    }, 2000);
                } else if (!config.hasBoss || window.bossSpawned) {
                    console.log('达到怪物数量上限，清除定时器');
                    clearInterval(spawnInterval);
                    spawnInterval = null;
                }
                return;
            }
            
            const types = ['🗑️', '💨', '💀', '🦠', '🧴', '🔋'];
            const type = types[Math.floor(Math.random() * types.length)];
            const baseInfo = monsterInfo[type];
            const monsterLevel = config.monsterLevel;
            const levelConfig = monsterLevelConfig[monsterLevel];
            
            const scaledHp = Math.floor(baseInfo.hp * levelConfig.hpMultiplier);
            const scaledReward = Math.floor(baseInfo.reward * levelConfig.rewardMultiplier);
            
            const info = {
                ...baseInfo,
                hp: scaledHp,
                reward: scaledReward
            };
            
            console.log('生成怪物:', type, '等级:', monsterLevel, '生命:', scaledHp, '奖励:', scaledReward);
            
            const monster = createMonsterElement(type, info, monsterLevel);
            document.querySelector('.center-battle').appendChild(monster);
            monsters.push(monster);
            monstersSpawned++;
            console.log('怪物已生成:', monster.dataset.id, 'level:', monsterLevel, 'reward:', monster.dataset.reward, '已生成:', monstersSpawned, '/', monstersToSpawn);
            
            moveMonster(monster);
        }

        function spawnBoss() {
            console.log('生成Boss怪物!');
            const bossType = '👹';
            const baseInfo = monsterInfo[bossType];
            const levelConfig = monsterLevelConfig[3];
            const scaledHp = Math.floor(baseInfo.hp * levelConfig.hpMultiplier);
            const scaledReward = Math.floor(baseInfo.reward * levelConfig.rewardMultiplier);
            
            const info = {
                ...baseInfo,
                hp: scaledHp,
                reward: scaledReward
            };
            
            const monster = createMonsterElement(bossType, info, 3);
            monster.style.transform = 'scale(2)';
            monster.style.zIndex = '100';
            monster.classList.add('boss');
            monster.dataset.isBoss = 'true';  // 添加属性标记Boss
            document.querySelector('.center-battle').appendChild(monster);
            monsters.push(monster);
            monstersSpawned++;
            
            moveMonster(monster);
        }

        function createMonsterElement(type, info, level = 1) {
            const monster = document.createElement('div');
            monster.className = 'monster';
            monster.textContent = type;
            monster.style.left = '8%';
            const randomTop = Math.floor(Math.random() * 60) + 15;
            monster.style.top = randomTop + '%';
            monster.dataset.id = monsterId++;
            monster.dataset.type = type;
            monster.dataset.level = level;
            monster.dataset.hp = info.hp;
            monster.dataset.maxHp = info.hp;
            monster.dataset.reward = info.reward;
            monster.dataset.slowed = '0';
            monster.dataset.slowEnd = '0';
            monster.dataset.x = '8';
            monster.dataset.y = randomTop.toString();
            
            if (level > 1) {
                const levelBadge = document.createElement('div');
                levelBadge.className = 'monster-level';
                levelBadge.textContent = level;
                levelBadge.style.cssText = `
                    position: absolute;
                    top: -8px;
                    right: -8px;
                    background: ${level === 2 ? '#ffa500' : '#ff4444'};
                    color: white;
                    font-size: 10px;
                    font-weight: bold;
                    width: 16px;
                    height: 16px;
                    border-radius: 50%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                `;
                monster.appendChild(levelBadge);
            }
            
            return monster;
        }

        function startWave() {
            console.log('startWave 被调用:', '当前波次:', currentWave, '总波次:', totalWaves);
            if (currentWave > totalWaves) {
                showVictory();
                return;
            }
            
            waveInProgress = true;
            window.bossSpawned = false;
            bossKilled = false;
            const config = waveConfig[currentWave];
            monstersToSpawn = config.count;
            monstersSpawned = 0;
            monstersKilled = 0;
            monstersEscaped = 0;
            
            updateWaveDisplay();
            
            console.log('开始波次:', currentWave, '怪物数量:', monstersToSpawn, '有Boss:', config.hasBoss || false);
            
            spawnInterval = setInterval(spawnMonster, config.interval);
        }

        function checkWaveComplete() {
            console.log('检查波次完成:', '进行中:', waveInProgress, '已生成:', monstersSpawned, '/', monstersToSpawn, '已击杀:', monstersKilled, '已逃离:', monstersEscaped, '场上怪物:', monsters.length, 'Boss已生成:', window.bossSpawned, 'Boss已击杀:', bossKilled);
            
            if (!waveInProgress) return;
            
            const config = waveConfig[currentWave];
            const hasBoss = config.hasBoss || false;
            const expectedTotal = hasBoss ? monstersToSpawn + 1 : monstersToSpawn;
            
            // 对于有Boss的波次，Boss必须被击杀才能胜利
            const bossHandled = !hasBoss || bossKilled;
            
            // 波次完成的条件：
            // 情况A：所有怪物都已经生成并且都被处理了
            const allSpawnedAndHandled = monstersSpawned >= monstersToSpawn && 
                                         (monstersKilled + monstersEscaped) >= monstersSpawned &&
                                         monsters.length === 0;
            
            // 情况B：所有应该生成的怪物都已经被处理了（提前完成）
            const allHandled = (monstersKilled + monstersEscaped) >= expectedTotal && 
                               monsters.length === 0;
            
            // 如果有Boss，还需要Boss已经被击杀
            const shouldCheckComplete = (allSpawnedAndHandled || allHandled) && bossHandled;
            
            if (shouldCheckComplete) {
                // 清除可能还在运行的生成定时器
                if (spawnInterval) {
                    clearInterval(spawnInterval);
                    spawnInterval = null;
                }
                
                waveInProgress = false;
                currentWave++;
                
                if (currentWave > totalWaves) {
                    showVictory();
                } else {
                    console.log('波次', currentWave - 1, '完成! 开始下一波...');
                    setTimeout(startWave, 3000);
                }
            }
        }

        function moveMonster(monster) {
            let x = 8;
            const y = parseFloat(monster.dataset.y);

            const interval = setInterval(() => {
                if (isPaused) return;

                const now = Date.now();
                const speed = parseInt(monster.dataset.slowed) === 1 && now < parseInt(monster.dataset.slowEnd) ? 0.15 : 0.3;
                x += speed;
                monster.style.left = x + '%';
                monster.dataset.x = x.toString();

                if (x >= 100) {
                    clearInterval(interval);
                    const isBoss = monster.dataset.isBoss === 'true';
                    monster.remove();
                    monsters = monsters.filter(m => m.dataset.id !== monster.dataset.id);
                    monstersEscaped++;  // 怪物逃离计入逃离计数
                    
                    // 如果是Boss逃离，直接游戏失败
                    if (isBoss) {
                        console.log('Boss逃离！游戏失败！');
                        isPaused = true;
                        window.location.href = 'gameover.html';
                        return;
                    }
                    
                    loseLife();
                    checkWaveComplete();
                    return;
                }

                if (checkWallCollision(x, y)) {
                    clearInterval(interval);
                    monster.remove();
                    monsters = monsters.filter(m => m.dataset.id !== monster.dataset.id);
                    checkWaveComplete();
                    return;
                }
            }, 50);

            monster.dataset.moveInterval = interval;
        }

        function checkWallCollision(xPercent, yPercent) {
            const wallCells = document.querySelectorAll('.wall-cell.placed');
            if (wallCells.length === 0) return false;

            for (const cell of wallCells) {
                const cellRect = cell.getBoundingClientRect();
                const centerX = window.innerWidth * (xPercent / 100);
                const centerY = window.innerHeight * (yPercent / 100);

                if (centerX >= cellRect.left && 
                    centerX <= cellRect.right &&
                    centerY >= cellRect.top && 
                    centerY <= cellRect.bottom) {
                    return true;
                }
            }
            return false;
        }

        function startTowerAttacks() {
            console.log('启动塔攻击:', 'wall-cell数量:', document.querySelectorAll('.wall-cell').length);
            const wallCells = document.querySelectorAll('.wall-cell');
            wallCells.forEach((cell, index) => {
                const towerType = cell.dataset.towerType;
                const towerEmoji = towerType ? emojis[towerType] : cell.textContent;
                console.log('检查塔:', index, '类型:', towerType, 'emoji:', towerEmoji, 'hasInfo:', !!towerInfo[towerEmoji], 'isPaused:', isPaused);
                
                if (towerEmoji && towerInfo[towerEmoji]) {

                    setInterval(() => {
                        if (!isPaused && cell.classList.contains('placed')) {
                            const towerId = cell.dataset.id;
                            const level = window.towerLevels[towerId] || 1;
                            const speedMultiplier = Math.pow(2, level - 1);
                            const actualInterval = Math.max(baseInfo.interval / speedMultiplier, 200);
                            
                            const lastAttackTime = cell.dataset.lastAttackTime ? parseInt(cell.dataset.lastAttackTime) : 0;
                            const now = Date.now();
                            
                            if (now - lastAttackTime >= actualInterval) {

                                console.log('塔攻击:', towerEmoji, '等级:', level, '攻速倍率:', speedMultiplier, '攻击间隔:', actualInterval);
                                attackFromTower(cell, towerEmoji, baseInfo);

        function attackFromTower(cell, emoji, info) {
            const rect = cell.getBoundingClientRect();
            const battleRect = document.querySelector('.center-battle').getBoundingClientRect();
            const startX = rect.left - battleRect.left;
            const startY = rect.top - battleRect.top + rect.height / 2;
            const cellIndex = cell.dataset.wall || Math.random().toString(36).substr(2, 9);
            const towerId = cell.dataset.id;
            const level = window.towerLevels[towerId] || 1;
            const damageMultiplier = Math.pow(2, level - 1);
            
            if (!cell.classList.contains('placed')) {
                console.log('塔未放置，跳过攻击');
                return;
            }
            
            console.log('塔攻击检查:', 'emoji:', emoji, 'info:', info, 'monsters.length:', monsters.length, 'level:', level, 'towerLevels:', towerLevels);
            
            if (!info) {
                console.log('塔信息不存在:', emoji);
                return;
            }
            
            if (monsters.length === 0) return;
            console.log('塔防攻击:', emoji, '等级:', level, '伤害倍率:', damageMultiplier, '怪物数量:', monsters.length);
            
            if (info.type === 'rainbow') {
                if (activeRainbowTowers.has(cellIndex)) return;
                activeRainbowTowers.add(cellIndex);
            }
            
            if (info.type === 'bomb') {
                if (activeBombTowers.has(cellIndex)) return;
                activeBombTowers.add(cellIndex);
            }
            
            const targetMonster = findNearestMonster(startX, startY);
            console.log('目标怪物:', targetMonster ? targetMonster.dataset.type : '无');
            
            if (info.type === 'ray' || info.type === 'water') {
                shootRay(startX, startY, targetMonster, emoji, info, damageMultiplier);
            } else if (info.type === 'bomb') {
                throwBomb(startX, startY, targetMonster, emoji, info, cellIndex, damageMultiplier);
            } else if (info.type === 'rainbow') {
                shootRainbow(startX, startY, targetMonster, emoji, info, cellIndex, damageMultiplier);
            }
        }

        function findNearestMonster(x, y) {
            let nearest = null;
            let minDistance = Infinity;
            
            monsters.forEach(monster => {
                const monRect = monster.getBoundingClientRect();
                const battleRect = document.querySelector('.center-battle').getBoundingClientRect();
                const monX = monRect.left - battleRect.left + monRect.width / 2;
                const monY = monRect.top - battleRect.top + monRect.height / 2;
                const distance = Math.sqrt(Math.pow(monX - x, 2) + Math.pow(monY - y, 2));
                
                if (distance < minDistance) {
                    minDistance = distance;
                    nearest = monster;
                }
            });
            
            return nearest;
        }

        function shootRay(x, y, targetMonster, emoji, info, damageMultiplier = 1) {
            if (!targetMonster) return;
            
            const projectile = document.createElement('div');
            projectile.className = 'projectile';
            projectile.textContent = info.type === 'water' ? '💧' : '✦';
            projectile.style.left = x + 'px';
            projectile.style.top = y + 'px';
            const actualDamage = Math.floor(info.damage * damageMultiplier);
            projectile.dataset.damage = actualDamage;
            projectile.dataset.type = info.type;
            
            document.querySelector('.center-battle').appendChild(projectile);
            projectiles.push(projectile);
            
            const battleRect = document.querySelector('.center-battle').getBoundingClientRect();
            const targetRect = targetMonster.getBoundingClientRect();
            const targetX = targetRect.left - battleRect.left + targetRect.width / 2;
            const targetY = targetRect.top - battleRect.top + targetRect.height / 2;
            
            const dx = targetX - x;
            const dy = targetY - y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const vx = (dx / distance) * 12;
            const vy = (dy / distance) * 12;
            
            const interval = setInterval(() => {
                if (isPaused) return;
                
                const currentX = parseFloat(projectile.style.left);
                const currentY = parseFloat(projectile.style.top);
                projectile.style.left = (currentX + vx) + 'px';
                projectile.style.top = (currentY + vy) + 'px';
                
                if (currentX > window.innerWidth || currentX < 0 || currentY > window.innerHeight || currentY < 0) {
                    clearInterval(interval);
                    projectile.remove();
                    projectiles = projectiles.filter(p => p !== projectile);
                    return;
                }
                
                checkMonsterHit(projectile, info);
            }, 15);
        }

        function shootRainbow(x, y, targetMonster, emoji, info, cellIndex, damageMultiplier = 1) {
            if (!targetMonster) {
                activeRainbowTowers.delete(cellIndex);
                return;
            }

                    projectiles = projectiles.filter(p => p !== projectile);

                checkRainbowHit(projectile, info);

        function checkMonsterHit(projectile, info) {
            const projRect = projectile.getBoundingClientRect();
            const battleRect = document.querySelector('.center-battle').getBoundingClientRect();
            
            monsters.forEach(monster => {
                const monRect = monster.getBoundingClientRect();
                const relX = monRect.left - battleRect.left;
                const relY = monRect.top - battleRect.top;
                
                if (projRect.left < monRect.right && 
                    projRect.right > monRect.left &&
                    projRect.top < monRect.bottom &&
                    projRect.bottom > monRect.top) {
                    
                    monster.dataset.hp = parseInt(monster.dataset.hp) - info.damage;
                    
                    if (info.type === 'water') {
                        monster.dataset.slowed = '1';
                        monster.dataset.slowEnd = Date.now() + 3000;
                    }
                    
                    projectile.remove();
                    projectiles = projectiles.filter(p => p !== projectile);
                    
                    if (parseInt(monster.dataset.hp) <= 0) {
                        console.log('怪物被击杀:', monster.dataset.type, '奖励:', monster.dataset.reward);
                        if (monster.dataset.moveInterval) {
                            clearInterval(parseInt(monster.dataset.moveInterval));
                        }
                        addGold(parseInt(monster.dataset.reward));
                        monstersKilled++;
                        
                        // 检查是否是Boss
                        if (monster.dataset.isBoss === 'true') {
                            bossKilled = true;
                            console.log('Boss被击杀！');
                        }
                        
                        monster.remove();
                        monsters = monsters.filter(m => m.dataset.id !== monster.dataset.id);
                        checkWaveComplete();
                    }
                }
            });
        }

        function checkBombHit(projectile, info, cellIndex, interval) {
            if (parseInt(projectile.dataset.active) === 0) return;
            
            const projRect = projectile.getBoundingClientRect();
            const battleRect = document.querySelector('.center-battle').getBoundingClientRect();
            
            let hit = false;
            monsters.forEach(monster => {
                const monRect = monster.getBoundingClientRect();
                
                if (projRect.left < monRect.right && 
                    projRect.right > monRect.left && 
                    projRect.top < monRect.bottom && 
                    projRect.bottom > monRect.top) {
                    hit = true;
                }
            });
            
            if (hit) {
                projectile.dataset.active = '0';
                
                const projCenterX = projRect.left - battleRect.left + projRect.width / 2;
                const projCenterY = projRect.top - battleRect.top + projRect.height / 2;
                
                createExplosion(projCenterX, projCenterY);
                
                monsters.forEach(monster => {
                    const monRect = monster.getBoundingClientRect();
                    const monCenterX = monRect.left - battleRect.left + monRect.width / 2;
                    const monCenterY = monRect.top - battleRect.top + monRect.height / 2;
                    const distance = Math.sqrt(Math.pow(monCenterX - projCenterX, 2) + Math.pow(monCenterY - projCenterY, 2));
                    
                    if (distance < 56) {
                        monster.dataset.hp = parseInt(monster.dataset.hp) - info.damage;
                        
                        if (parseInt(monster.dataset.hp) <= 0) {
                            if (monster.dataset.moveInterval) {
                                clearInterval(parseInt(monster.dataset.moveInterval));
                            }
                            addGold(parseInt(monster.dataset.reward));
                            monstersKilled++;
                            
                            // 检查是否是Boss
                            if (monster.dataset.isBoss === 'true') {
                                bossKilled = true;
                                console.log('Boss被击杀！');
                            }
                            
                            monster.remove();
                            monsters = monsters.filter(m => m.dataset.id !== monster.dataset.id);
                            checkWaveComplete();
                        }
                    }
                });
                
                projectile.remove();
                projectiles = projectiles.filter(p => p !== projectile);
                activeBombTowers.delete(cellIndex);
                if (interval) {
                    clearInterval(interval);
                }
            }
        }

        function createExplosion(x, y) {
            const explosion = document.createElement('div');
            explosion.className = 'explosion';
            explosion.style.left = (x - 28) + 'px';
            explosion.style.top = (y - 28) + 'px';
            explosion.style.width = '56px';
            explosion.style.height = '56px';
            
            document.querySelector('.center-battle').appendChild(explosion);
            
            setTimeout(() => {
                explosion.remove();

        function checkRainbowHit(projectile, info) {
            const projRect = projectile.getBoundingClientRect();
            
            if (!projectile.dataset.hitMonsters) {
                projectile.dataset.hitMonsters = '';
            }
            const hitMonsters = projectile.dataset.hitMonsters.split(',').filter(id => id);
            
            monsters.forEach(monster => {
                const monRect = monster.getBoundingClientRect();
                
                if (projRect.left < monRect.right && 
                    projRect.right > monRect.left &&
                    projRect.top < monRect.bottom &&
                    projRect.bottom > monRect.top) {
                    
                    if (!hitMonsters.includes(monster.dataset.id)) {
                        monster.dataset.hp = parseInt(monster.dataset.hp) - info.damage;
                        projectile.dataset.hitMonsters += ',' + monster.dataset.id;
                        
                        if (parseInt(monster.dataset.hp) <= 0) {
                            if (monster.dataset.moveInterval) {
                                clearInterval(parseInt(monster.dataset.moveInterval));
                            }
                            addGold(parseInt(monster.dataset.reward));
                            monstersKilled++;
                            
                            // 检查是否是Boss
                            if (monster.dataset.isBoss === 'true') {
                                bossKilled = true;
                                console.log('Boss被击杀！');
                            }
                            
                            monster.remove();
                            monsters = monsters.filter(m => m.dataset.id !== monster.dataset.id);
                            checkWaveComplete();
                        }
                    }
                }
            });
        }

                    console.log('放置塔后启动攻击');
                    startTowerAttacks();
                } else {
                    hideTowerMenu();
                }
            });
        });

                const costs = {
                    'basic': { 2: 75, 3: 100 },
                    'water': { 2: 120, 3: 160 },
                    'light': { 2: 180, 3: 240 },
                    'rainbow': { 2: 270, 3: 360 },
                    'wind': { 2: 225, 3: 300 },
                    'solar': { 2: 300, 3: 400 },
                    'purify': { 2: 375, 3: 500 },
                    'thunder': { 2: 450, 3: 600 }
                };
                
                if (costs[towerType]) {
                    upgradeCost = costs[towerType][level + 1];
                    console.log('找到升级费用:', upgradeCost);
                }
            }
            
            menu.innerHTML = `
                <div style="margin-bottom: 8px; font-weight: bold; text-align: center;">等级: ${level}</div>
                ${level < 3 
                    ? `<button onclick="upgradeTower('${cell.dataset.id}')" class="upgrade-btn" style="display: block; width: 100%;">升级 (${upgradeCost !== '-' ? upgradeCost + '💰' : '需要金币'})</button>` 
                    : '<div style="color: gold; text-align: center; font-weight: bold;">满级!</div>'}
                <button onclick="removeTower('${cell.dataset.id}')" class="remove-btn" style="display: block; width: 100%; margin-top: 5px;">拆除</button>
            `;
            
            cell.appendChild(menu);
            console.log('菜单已添加到格子');
        }

        function hideTowerMenu() {
            document.querySelectorAll('.tower-menu').forEach(menu => menu.remove());
            selectedTowerCell = null;
        }

        function updateTowerLevelDisplay(cell, level) {
            let levelBadge = cell.querySelector('.tower-level-badge');
            if (levelBadge) {
                levelBadge.remove();
            }
            
            if (level > 1) {
                levelBadge = document.createElement('div');
                levelBadge.className = 'tower-level-badge';
                levelBadge.textContent = level;
                levelBadge.style.cssText = `
                    position: absolute;
                    top: 2px;
                    right: 2px;
                    background: ${level === 2 ? '#ffa500' : '#ffd700'};
                    color: ${level === 2 ? 'white' : '#000'};
                    font-size: 10px;
                    font-weight: bold;
                    width: 16px;
                    height: 16px;
                    border-radius: 50%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    z-index: 10;
                `;
                cell.appendChild(levelBadge);
            }
        }

        window.upgradeTower = function(towerId) {
            console.log('升级塔被调用:', '塔ID:', towerId);
            const cell = document.querySelector(`.wall-cell[data-id="${towerId}"]`);
            console.log('找到的格子:', cell);
            if (!cell) return;
            
            const towerType = cell.dataset.towerType;
            const level = window.towerLevels[towerId] || 1;
            
            console.log('塔信息:', '类型:', towerType, '等级:', level);
            
            if (level >= 3) {
                console.log('已达最大等级!');
                return;
            }
            
            const costs = {
                'basic': { 2: 75, 3: 100 },
                'water': { 2: 120, 3: 160 },
                'light': { 2: 180, 3: 240 },
                'rainbow': { 2: 270, 3: 360 },
                'wind': { 2: 225, 3: 300 },
                'solar': { 2: 300, 3: 400 },
                'purify': { 2: 375, 3: 500 },
                'thunder': { 2: 450, 3: 600 }
            };
            
            const upgradeCost = costs[towerType] ? costs[towerType][level + 1] : null;
            console.log('升级费用:', upgradeCost, '当前金币:', gold);
            
            if (!upgradeCost || gold < upgradeCost) {
                console.log('金币不足或费用无效，无法升级!');
                showNotification('💰 金币不足！需要 ' + upgradeCost + ' 金币');
                return;
            }
            
            gold -= upgradeCost;
            window.towerLevels[towerId] = level + 1;
            updateGoldDisplay();
            
            const newLevel = level + 1;
            updateTowerLevelDisplay(cell, newLevel);
            
            const damageMultiplier = 1 + (newLevel - 1) * 0.5;
            console.log(`塔升级成功! 等级: ${newLevel}, 伤害倍率: ${damageMultiplier}, 剩余金币: ${gold}`);
            
            hideTowerMenu();
            
            console.log('升级完成，塔继续攻击中');
        };

        window.removeTower = function(towerId) {
            console.log('拆除塔被调用:', '塔ID:', towerId);
            const cell = document.querySelector(`.wall-cell[data-id="${towerId}"]`);
            console.log('找到的格子:', cell);
            if (!cell) return;
            
            delete window.towerLevels[towerId];
            cell.classList.remove('placed');
            cell.textContent = '';
            cell.removeAttribute('data-id');
            cell.removeAttribute('data-tower-type');
            
            const levelBadge = cell.querySelector('.tower-level-badge');
            if (levelBadge) {
                levelBadge.remove();
            }
            
            console.log('塔已拆除');
            
            hideTowerMenu();
        };

        document.querySelector('.back-btn').addEventListener('click', () => {
            window.location.href = 'game.html';
        });

        document.addEventListener('click', (e) => {
            const menu = document.querySelector('.tower-menu');
            if (menu && !e.target.closest('.tower-menu')) {
                hideTowerMenu();
            }
        });

        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(0, 0, 0, 0.85);
                color: #ffd700;
                padding: 15px 30px;
                border-radius: 10px;
                font-size: 18px;
                font-weight: bold;
                z-index: 2000;
                animation: fadeInScale 0.3s ease-out;
                border: 2px solid #ffd700;
                box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            `;
            notification.textContent = message;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'fadeOutScale 0.3s ease-out';
                setTimeout(() => {
                    notification.remove();
                }, 300);
            }, 1000);
        }

        document.getElementById('pauseBtn').addEventListener('click', () => {
            pauseGame();
        });

        document.getElementById('resumeBtn').addEventListener('click', () => {
            resumeGame();
        });

        document.getElementById('exitBtn').addEventListener('click', () => {
            window.location.href = 'levels.html';
        });

        function pauseGame() {
            isPaused = true;
            document.getElementById('pauseOverlay').classList.add('show');
            document.body.style.overflow = 'hidden';
            
            monsters.forEach(monster => {
                monster.style.animationPlayState = 'paused';
            });
            
            projectiles.forEach(proj => {
                proj.style.animationPlayState = 'paused';
            });
        }

        function resumeGame() {
            isPaused = false;
            document.getElementById('pauseOverlay').classList.remove('show');
            document.body.style.overflow = 'auto';
            
            monsters.forEach(monster => {
                monster.style.animationPlayState = 'running';
            });
            
            projectiles.forEach(proj => {
                proj.style.animationPlayState = 'running';
            });
        }

        function spawnMonsterIfNotPaused() {
            if (!isPaused) {
                spawnMonster();
            }
        }

        function restartGame() {
            window.location.href = 'game.html';
        }

        function goHome() {
            window.location.href = 'index.html';
        }

        loadTowers();
        setTimeout(startTowerAttacks, 1000);
        setTimeout(startWave, 2000);
    </script>
</body>
</html>
