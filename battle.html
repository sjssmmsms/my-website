                                clearInterval(parseInt(monster.dataset.moveInterval));
                            }
                            addGold(parseInt(monster.dataset.reward));
                            
                            // 检查是否是Boss
                            if (monster.dataset.isBoss === 'true') {
                                bossKilled = true;
                                console.log('Boss被击杀！');
                            }
                            
                            monster.remove();
                            monsters = monsters.filter(m => m.dataset.id !== monster.dataset.id);
                        }
                    }
                }
            });
        }

        document.querySelectorAll('.tower-slot').forEach(slot => {
            slot.addEventListener('click', () => {
                if (slot.dataset.towerType) {
                    document.querySelectorAll('.tower-slot').forEach(s => s.classList.remove('selected'));
                    slot.classList.add('selected');
                    selectedSlot = slot;
                }
            });
        });

        document.querySelectorAll('.wall-cell').forEach(cell => {
            cell.addEventListener('click', (e) => {
                console.log('墙格子点击:', '已放置:', cell.classList.contains('placed'), '塔ID:', cell.dataset.id, '等级:', window.towerLevels[cell.dataset.id], '塔类型:', cell.dataset.towerType);
                
                if (cell.classList.contains('placed')) {
                    e.stopPropagation();
                    const towerType = cell.dataset.towerType;
                    const towerEmoji = towerType ? emojis[towerType] : '';
                    const level = window.towerLevels[cell.dataset.id] || 1;
                    
                    console.log('塔信息:', '表情:', towerEmoji, '类型:', towerType, '等级:', level);
                    
                    if (selectedTowerCell === cell) {
                        console.log('关闭菜单');
                        hideTowerMenu();
                        return;
                    }
                    
                    selectedTowerCell = cell;
                    showTowerMenu(cell, towerType, level);
                } else if (selectedSlot && selectedSlot.dataset.towerType) {
                    const towerType = selectedSlot.dataset.towerType;
                    const emoji = emojis[towerType];
                    
                    const cost = towerCosts[towerType];
                    console.log('放置塔:', '类型:', towerType, '费用:', cost, '当前金币:', gold);
                    
                    if (cost === undefined || cost === null) {
                        console.log('塔类型无效:', towerType);
                        showNotification('❌ 塔类型无效');
                        return;
                    }
                    
                    if (gold < cost) {
                        console.log('金币不足!');
                        showNotification('💰 金币不足！需要 ' + cost + ' 金币');
                        return;
                    }
                    
                    gold -= cost;
                    console.log('金币扣除后:', gold);
                    updateGoldDisplay();
                    
                    const towerId = 'tower_' + Date.now();
                    cell.dataset.id = towerId;
                    cell.dataset.towerType = towerType;
                    cell.classList.add('placed');
                    cell.innerHTML = createTowerEmoji(towerType, false);
                    window.towerLevels[towerId] = 1;
                    
                    updateTowerLevelDisplay(cell, 1);
                    
                    selectedSlot.classList.remove('selected');
                    selectedSlot = null;
                    hideTowerMenu();
                } else {
                    hideTowerMenu();
                }
            });
        });

        function showTowerMenu(cell, towerType, level) {
            const towerEmoji = towerType ? emojis[towerType] : '';
            console.log('显示塔菜单:', '塔类型:', towerType, '等级:', level, 'emoji:', towerEmoji);
            hideTowerMenu();
            
            const menu = document.createElement('div');
            menu.className = 'tower-menu';
            
            let upgradeCost = '-';
            if (level < 3 && towerType) {
                const costs = {
                    'basic': { 2: 75, 3: 100 },
                    'water': { 2: 120, 3: 160 },
                    'light': { 2: 180, 3: 240 },
                    'rainbow': { 2: 270, 3: 360 },
                    'wind': { 2: 225, 3: 300 },
                    'solar': { 2: 300, 3: 400 },
                    'purify': { 2: 375, 3: 500 },
                    'thunder': { 2: 450, 3: 600 }
                };
                
                if (costs[towerType]) {
                    upgradeCost = costs[towerType][level + 1];
                    console.log('找到升级费用:', upgradeCost);
                }
            }
            
            menu.innerHTML = `
                <div style="margin-bottom: 10px; font-weight: bold; text-align: center; color: #ffd700; font-size: 14px;">等级: ${level}</div>
                ${level < 3 
                    ? `<button onclick="upgradeTower('${cell.dataset.id}')" class="upgrade-btn" style="display: block; width: 100%; padding: 8px 12px; margin-bottom: 6px;">升级 (${upgradeCost !== '-' ? upgradeCost + '💰' : '需要金币'})</button>` 
                    : '<div style="color: gold; text-align: center; font-weight: bold; padding: 8px; background: rgba(255,215,0,0.1); border-radius: 4px;">满级!</div>'}
                <button onclick="removeTower('${cell.dataset.id}')" class="remove-btn" style="display: block; width: 100%; padding: 8px 12px;">拆除</button>
            `;
            
            const cellRect = cell.getBoundingClientRect();
            const menuWidth = 130;
            const menuHeight = 90;
            
            let menuLeft = cellRect.left + cellRect.width / 2 - menuWidth / 2;
            let menuTop = cellRect.bottom + 8;
            
            if (menuLeft + menuWidth > window.innerWidth) {
                menuLeft = window.innerWidth - menuWidth - 10;
            }
            if (menuLeft < 10) {
                menuLeft = 10;
            }
            
            if (menuTop + menuHeight > window.innerHeight) {
                menuTop = cellRect.top - menuHeight - 8;
            }
            
            menu.style.left = menuLeft + 'px';
            menu.style.top = menuTop + 'px';
            
            document.body.appendChild(menu);
            console.log('菜单已添加到页面');
        }

        function hideTowerMenu() {
            document.querySelectorAll('.tower-menu').forEach(menu => menu.remove());
            selectedTowerCell = null;
        }

        function updateTowerLevelDisplay(cell, level) {
            let levelBadge = cell.querySelector('.tower-level-badge');
            if (levelBadge) {
                levelBadge.remove();
            }
            
            if (level > 1) {
                levelBadge = document.createElement('div');
                levelBadge.className = 'tower-level-badge';
                levelBadge.textContent = level;
                levelBadge.style.cssText = `
                    position: absolute;
                    top: 2px;
                    right: 2px;
                    background: ${level === 2 ? '#ffa500' : '#ffd700'};
                    color: ${level === 2 ? 'white' : '#000'};
                    font-size: 10px;
                    font-weight: bold;
                    width: 16px;
                    height: 16px;
                    border-radius: 50%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    z-index: 10;
                `;
                cell.appendChild(levelBadge);
            }
        }

        window.upgradeTower = function(towerId) {
            console.log('升级塔被调用:', '塔ID:', towerId);
            const cell = document.querySelector(`.wall-cell[data-id="${towerId}"]`);
            console.log('找到的格子:', cell);
            if (!cell) return;
            
            const towerType = cell.dataset.towerType;
            const level = window.towerLevels[towerId] || 1;
            
            console.log('塔信息:', '类型:', towerType, '等级:', level);
            
            if (level >= 3) {
                console.log('已达最大等级!');
                return;
            }
            
            const costs = {
                'basic': { 2: 75, 3: 100 },
                'water': { 2: 120, 3: 160 },
                'light': { 2: 180, 3: 240 },
                'rainbow': { 2: 270, 3: 360 },
                'wind': { 2: 225, 3: 300 },
                'solar': { 2: 300, 3: 400 },
                'purify': { 2: 375, 3: 500 },
                'thunder': { 2: 450, 3: 600 }
            };
            
            const upgradeCost = costs[towerType] ? costs[towerType][level + 1] : null;
            console.log('升级费用:', upgradeCost, '当前金币:', gold);
            
            if (!upgradeCost || gold < upgradeCost) {
                console.log('金币不足或费用无效，无法升级!');
                showNotification('💰 金币不足！需要 ' + upgradeCost + ' 金币');
                return;
            }
            
            gold -= upgradeCost;
            window.towerLevels[towerId] = level + 1;
            updateGoldDisplay();
            
            const newLevel = level + 1;
            updateTowerLevelDisplay(cell, newLevel);
            
            const damageMultiplier = Math.pow(2, newLevel - 1);
            console.log(`塔升级成功! 等级: ${newLevel}, 伤害倍率: ${damageMultiplier}, 剩余金币: ${gold}`);
            
            hideTowerMenu();
            
            console.log('升级完成，塔继续攻击中');
        };

        window.removeTower = function(towerId) {
            console.log('拆除塔被调用:', '塔ID:', towerId);
            const cell = document.querySelector(`.wall-cell[data-id="${towerId}"]`);
            console.log('找到的格子:', cell);
            if (!cell) return;
            
            delete window.towerLevels[towerId];
            cell.classList.remove('placed');
            cell.innerHTML = '';
            cell.removeAttribute('data-id');
            cell.removeAttribute('data-tower-type');
            
            const levelBadge = cell.querySelector('.tower-level-badge');
            if (levelBadge) {
                levelBadge.remove();
            }
            
            console.log('塔已拆除');
            
            hideTowerMenu();
        };

        document.querySelector('.back-btn').addEventListener('click', () => {
            window.location.href = 'game.html';
        });

        document.addEventListener('click', (e) => {
            const menu = document.querySelector('.tower-menu');
            if (menu && !e.target.closest('.tower-menu')) {
                hideTowerMenu();
            }
        });

        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(0, 0, 0, 0.85);
                color: #ffd700;
                padding: 15px 30px;
                border-radius: 10px;
                font-size: 18px;
                font-weight: bold;
                z-index: 2000;
                animation: fadeInScale 0.3s ease-out;
                border: 2px solid #ffd700;
                box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            `;
            notification.textContent = message;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'fadeOutScale 0.3s ease-out';
                setTimeout(() => {
                    notification.remove();
                }, 300);
            }, 1000);
        }

        document.getElementById('pauseBtn').addEventListener('click', () => {
            pauseGame();
        });

        document.getElementById('resumeBtn').addEventListener('click', () => {
            resumeGame();
        });

        document.getElementById('exitBtn').addEventListener('click', () => {
            window.location.href = 'levels.html';
        });

        function pauseGame() {
            isPaused = true;
            pauseTimestamp = Date.now();
            document.getElementById('pauseOverlay').classList.add('show');
            document.body.style.overflow = 'hidden';
            
            monsters.forEach(monster => {
                monster.style.animationPlayState = 'paused';
            });
            
            projectiles.forEach(proj => {
                proj.style.animationPlayState = 'paused';
            });
            
            // 清除所有定时器，确保没有东西在后台运行
            if (spawnTimer) {
                clearTimeout(spawnTimer);
                spawnTimer = null;
            }
            if (waveCompleteTimer) {
                clearInterval(waveCompleteTimer);
                waveCompleteTimer = null;
            }
        }

        function resumeGame() {
            isPaused = false;
            pauseTimestamp = null;
            document.getElementById('pauseOverlay').classList.remove('show');
            document.body.style.overflow = 'auto';
            
            monsters.forEach(monster => {
                monster.style.animationPlayState = 'running';
            });
            
            projectiles.forEach(proj => {
                proj.style.animationPlayState = 'running';
            });
            
            // 只有在spawning状态下才恢复怪物生成
            if (waveState === 'spawning' && spawnQueue.length > 0) {
                const config = waveConfig[currentWave];
                spawnTimer = setTimeout(() => spawnNextMonster(config.interval), config.interval);
            }
            // 恢复波次完成检查
            if (waveState === 'waiting_for_complete') {
                startWaveCompleteCheck();
            }
        }

        function restartGame() {
            window.location.href = 'game.html';
        }

        function goHome() {
            window.location.href = 'index.html';
        }

        function debugNextWave() {
            console.log('手动触发下一波');
            waveState = 'idle';
            currentWave++;
            startWave();
        }

        function handleResize() {
            const battleContainer = document.querySelector('.battle-container');
            if (battleContainer) {
                battleContainer.style.minHeight = window.innerHeight - 36 + 'px';
            }
        }
        
        window.addEventListener('resize', handleResize);
        window.addEventListener('orientationchange', handleResize);
        
        handleResize();
        
        updateGoldDisplay();
        loadTowers();
        setTimeout(startWave, 2000);
    </script>
</body>
</html>
