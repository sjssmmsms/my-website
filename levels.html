<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>选择关卡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            text-align: center;
        }
        h1 {
            margin-bottom: 30px;
            color: #4ecdc4;
        }
        .levels-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .level-card {
            width: 80px;
            height: 80px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 28px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .level-card.unlocked {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
        }
        .level-card.locked {
            background: #374151;
            color: #9ca3af;
        }
        .level-number {
            font-size: 32px;
        }
        .lock-icon {
            font-size: 32px;
        }
        .back-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            margin-right: 10px;
        }
        .reset-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }
        
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-overlay.show {
            display: flex;
        }
        
        .modal {
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 320px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        
        .modal h2 {
            color: #ef4444;
            margin-bottom: 15px;
            font-size: 22px;
        }
        
        .modal p {
            color: #9ca3af;
            margin-bottom: 25px;
            font-size: 14px;
        }
        
        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        
        .modal-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }
        
        .modal-btn:hover {
            transform: scale(1.05);
        }
        
        .confirm-btn {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }
        
        .cancel-btn {
            background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 选择关卡</h1>
        
        <div class="levels-grid" id="levelsGrid">
        </div>
        
        <button class="back-btn" id="backBtn">◀ 返回</button>
        <button class="reset-btn" id="resetBtn">🔄 重置进度</button>
    </div>

    <!-- 重置确认弹窗 -->
    <div class="modal-overlay" id="resetModal">
        <div class="modal">
            <h2>⚠️ 确认重置</h2>
            <p>确定要重置游戏进度吗？这将清空所有关卡进度，只有第一关会被解锁。</p>
            <div class="modal-buttons">
                <button class="modal-btn confirm-btn" id="confirmReset">确认重置</button>
                <button class="modal-btn cancel-btn" id="cancelReset">取消</button>
            </div>
        </div>
    </div>

    <script>
        // 初始化 - 确保只有第一关解锁
        if (!localStorage.getItem('unlockedLevel')) {
            localStorage.setItem('unlockedLevel', '1');
        }
        
        const unlockedLevel = parseInt(localStorage.getItem('unlockedLevel')) || 1;
        const grid = document.getElementById('levelsGrid');
        
        const resetModal = document.getElementById('resetModal');
        
        function showResetModal() {
            resetModal.classList.add('show');
        }
        
        function hideResetModal() {
            resetModal.classList.remove('show');
        }
        
        function confirmReset() {
            localStorage.removeItem('unlockedLevel');
            localStorage.removeItem('currentLevel');
            localStorage.removeItem('battleResult');
            localStorage.setItem('unlockedLevel', '1');
            location.reload();
        }
        
        for (let level = 1; level <= 10; level++) {
            const card = document.createElement('div');
            card.className = 'level-card ' + (level <= unlockedLevel ? 'unlocked' : 'locked');
            
            if (level <= unlockedLevel) {
                card.innerHTML = '<span class="level-number">' + level + '</span>';
                card.onclick = function() {
                    localStorage.setItem('currentLevel', level.toString());
                    window.location.href = 'game.html?level=' + level;
                };
            } else {
                card.innerHTML = '<span class="lock-icon">🔒</span>';
            }
            
            grid.appendChild(card);
        }
        
        document.getElementById('backBtn').addEventListener('click', function() {
            window.location.href = 'index.html';
        });
        
        document.getElementById('resetBtn').addEventListener('click', showResetModal);
        document.getElementById('confirmReset').addEventListener('click', confirmReset);
        document.getElementById('cancelReset').addEventListener('click', hideResetModal);
    </script>
</body>
</html>
