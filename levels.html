<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="screen-orientation" content="landscape">
    <meta name="orientation" content="landscape">
    <title>我是环境检察员 - 选择关卡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 30px;
        }

        h1 {
            font-size: 2.5rem;
            color: #4ade80;
            text-shadow: 0 0 20px rgba(74, 222, 128, 0.5);
            margin-bottom: 40px;
        }

        .levels-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            max-width: 500px;
            margin-top: -33px;
            margin-bottom: -33px;
        }

        .level-card {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .level-card.locked {
            background: linear-gradient(135deg, #374151 0%, #1f2937 100%);
            cursor: not-allowed;
        }

        .level-card.unlocked {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
        }

        .level-card.unlocked:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 30px rgba(34, 197, 94, 0.4);
        }

        .level-number {
            font-size: 1.8rem;
            font-weight: bold;
            color: white;
        }

        .lock-icon {
            font-size: 2rem;
        }

        .star-rating {
            display: flex;
            gap: 2px;
            margin-top: 5px;
        }

        .star {
            font-size: 12px;
            color: #ffd700;
        }

        .back-btn {
            margin-top: 40px;
            padding: 12px 30px;
            font-size: 1rem;
            color: white;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .back-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(99, 102, 241, 0.4);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .levels-grid {
                gap: 15px;
            }

            .level-card {
                width: 60px;
                height: 60px;
            }

            .level-number {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 选择关卡</h1>
        <div class="levels-grid">
            <div class="level-card unlocked" data-level="1">
                <span class="level-number">1</span>
                <div class="star-rating">
                    <span class="star">⭐</span>
                    <span class="star">⭐</span>
                    <span class="star">⭐</span>
                </div>
            </div>
            <div class="level-card locked" data-level="2">
                <span class="lock-icon">🔒</span>
            </div>
            <div class="level-card locked" data-level="3">
                <span class="lock-icon">🔒</span>
            </div>
            <div class="level-card locked" data-level="4">
                <span class="lock-icon">🔒</span>
            </div>
            <div class="level-card locked" data-level="5">
                <span class="lock-icon">🔒</span>
            </div>
            <div class="level-card locked" data-level="6">
                <span class="lock-icon">🔒</span>
            </div>
            <div class="level-card locked" data-level="7">
                <span class="lock-icon">🔒</span>
            </div>
            <div class="level-card locked" data-level="8">
                <span class="lock-icon">🔒</span>
            </div>
            <div class="level-card locked" data-level="9">
                <span class="lock-icon">🔒</span>
            </div>
            <div class="level-card locked" data-level="10">
                <span class="lock-icon">🔒</span>
            </div>
        </div>
        <button class="back-btn" id="backBtn">◀ 返回</button>
    </div>

    <script>
        document.querySelectorAll('.level-card.unlocked').forEach(card => {
            card.addEventListener('click', () => {
                const level = card.dataset.level;
                window.location.href = `game.html?level=${level}`;
            });
        });

        document.getElementById('backBtn').addEventListener('click', () => {
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
